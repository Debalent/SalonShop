name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main          # trigger on every push to main
  workflow_dispatch:  # allow manual trigger from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm install --legacy-peer-deps

      - name: Disable API routes and middleware for static export
        working-directory: apps/web/src
        run: |
          mv app/api _api_backup || true
          mv middleware.ts _middleware_backup.ts || true

      - name: Build static export
        working-directory: apps/web
        env:
          GITHUB_PAGES: "true"
          # ⚠️  Change /SalonShop to your actual GitHub repo name
          # e.g. if your repo is github.com/jane/my-salon → BASE_PATH=/my-salon
          # If you use a custom domain (e.g. salonshop.com), set BASE_PATH=
          BASE_PATH: "/SalonShop"
          # Placeholder values so the build doesn't crash on missing env vars
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_placeholder"
          NEXT_PUBLIC_APP_URL: "https://placeholder.github.io/SalonShop"
          NEXT_PUBLIC_BASE_PATH: "/SalonShop"
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
