<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="squareLogoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D32F2F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </linearGradient>
    <filter id="squareShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" rx="30" fill="url(#squareLogoGradient)" filter="url(#squareShadow)"/>
  
  <!-- Large S -->
  <circle cx="100" cy="80" r="35" fill="white" opacity="0.95"/>
  <text x="100" y="95" font-family="Georgia, serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#D32F2F">S</text>
  
  <!-- SalonShop Text -->
  <text x="100" y="140" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">SALON</text>
  <text x="100" y="160" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">SHOP</text>
  
  <!-- Decorative corners -->
  <circle cx="40" cy="40" r="4" fill="white" opacity="0.6"/>
  <circle cx="160" cy="40" r="4" fill="white" opacity="0.6"/>
  <circle cx="40" cy="160" r="4" fill="white" opacity="0.6"/>
  <circle cx="160" cy="160" r="4" fill="white" opacity="0.6"/>
</svg>