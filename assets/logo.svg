<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D32F2F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" stroke="#fff" stroke-width="4"/>
  
  <!-- Salon Chair -->
  <path d="M60 140 L60 120 Q60 110 70 110 L130 110 Q140 110 140 120 L140 140 Q140 150 130 150 L70 150 Q60 150 60 140 Z" fill="#fff"/>
  
  <!-- Scissors -->
  <g transform="translate(85,70) rotate(-30)">
    <ellipse cx="0" cy="-8" rx="3" ry="8" fill="#fff"/>
    <ellipse cx="0" cy="8" rx="3" ry="8" fill="#fff"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#fff" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#D32F2F"/>
  </g>
  
  <!-- Comb -->
  <g transform="translate(115,70) rotate(30)">
    <rect x="-2" y="-12" width="4" height="24" fill="#fff" rx="2"/>
    <line x1="-4" y1="-8" x2="4" y2="-8" stroke="#fff" stroke-width="1"/>
    <line x1="-4" y1="-4" x2="4" y2="-4" stroke="#fff" stroke-width="1"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#fff" stroke-width="1"/>
    <line x1="-4" y1="4" x2="4" y2="4" stroke="#fff" stroke-width="1"/>
    <line x1="-4" y1="8" x2="4" y2="8" stroke="#fff" stroke-width="1"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#D32F2F">SalonShop</text>
</svg>