<svg width="300" height="100" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="salonShopGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D32F2F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="100" rx="20" fill="url(#salonShopGradient)" filter="url(#shadow)"/>
  
  <!-- Decorative S -->
  <g transform="translate(30,50)">
    <circle cx="0" cy="0" r="25" fill="white" opacity="0.9"/>
    <text x="0" y="8" font-family="Georgia, serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#D32F2F">S</text>
  </g>
  
  <!-- Main Text -->
  <text x="90" y="42" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="white">Salon</text>
  <text x="90" y="68" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="white">Shop</text>
  
  <!-- Decorative Elements -->
  <line x1="200" y1="25" x2="270" y2="25" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="200" y1="75" x2="270" y2="75" stroke="white" stroke-width="2" opacity="0.7"/>
  
  <!-- Small Icons -->
  <g transform="translate(235,35)">
    <circle cx="0" cy="0" r="8" fill="white" opacity="0.8"/>
    <text x="0" y="3" font-family="Arial" font-size="10" text-anchor="middle" fill="#D32F2F">✂</text>
  </g>
  
  <g transform="translate(255,55)">
    <circle cx="0" cy="0" r="6" fill="white" opacity="0.6"/>
    <text x="0" y="2" font-family="Arial" font-size="8" text-anchor="middle" fill="#D32F2F">💄</text>
  </g>
</svg>